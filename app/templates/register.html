{% extends "base.html" %}

{% block title %}Register - LegalGPT{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-shield-check"></i>
            <span>LegalGPT</span>
        </div>
        <p class="auth-subtitle">Create your account to get started</p>

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Choose a username" required autofocus minlength="3">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="At least 6 characters" required minlength="6">
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter your password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <p class="text-center mt-4 mb-0" style="font-size: 0.9rem;">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
